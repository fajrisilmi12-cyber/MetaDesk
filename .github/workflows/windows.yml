name: Windows build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v prefix"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" != "v*" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(grep -oP 'var appVersion = \"\K[^\"]+' updater.go)"
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || {
            echo "Invalid version: $VERSION"; exit 1;
          }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building MetaDesk v${VERSION}"

      - name: Build Windows binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-H windowsgui -X main.appVersion=${VERSION}" \
            -trimpath -o MetaDesk.exe .
          rm -f "MetaDesk-Windows-x64.zip"
          zip -q MetaDesk-Windows-x64.zip MetaDesk.exe
